<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сторінка не знайдена | 404</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .error-page {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            background-color: #f8f9fa;
            padding: 20px;
        }
        .error-page h1 {
            font-size: 8rem;
            color: #e85b8c;
            margin-bottom: 0;
            font-family: 'Arial', sans-serif;
        }
        .error-page p {
            font-size: 1.5rem;
            color: #333;
            margin-bottom: 30px;
        }
    </style>
</head>
<body>
    <div class="error-page">
        <h1>404</h1>
        <p>Схоже, ви заблукали десь між цими 3000 кілометрами...</p>
        <a href="index.html" class="btn btn-pink">Повернутися на весілля</a>
    </div>
</body>
</html>
